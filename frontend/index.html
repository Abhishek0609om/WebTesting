<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 shadow-md py-4 px-6 text-white flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">Enterprise User Portal</h1>
        <span class="text-xs bg-indigo-500 py-1 px-3 rounded-full font-medium">Connected to Cluster</span>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-6 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Column: Add User Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 pb-2 border-b border-slate-100">Add New User</h2>
            <form id="userForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <div>
                    <label for="age" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Age</label>
                    <input type="number" id="age" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow transition duration-150">
                    Add User
                </button>
            </form>
        </div>

        <!-- Right Column: User List Table -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 pb-2 border-b border-slate-100 flex justify-between items-center">
                <span>Registered Users</span>
                <span id="userCount" class="text-xs bg-slate-100 text-slate-600 py-1 px-2.5 rounded-full">0 users</span>
            </h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3 font-semibold">Name</th>
                            <th class="py-3 px-3 font-semibold">Email</th>
                            <th class="py-3 px-3 font-semibold">Age</th>
                            <th class="py-3 px-3 font-semibold text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic rows will appear here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        DevOps Containerized Stack &bull; FastAPI + Nginx + MongoDB
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = '/api/users';

        async function fetchUsers() {
            try {
                const response = await fetch(API_URL);
                const users = await response.json();
                
                const tbody = document.getElementById('userTableBody');
                const userCount = document.getElementById('userCount');
                tbody.innerHTML = '';
                userCount.textContent = `${users.length} user${users.length === 1 ? '' : 's'}`;

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400 italic">No users found in database.</td></tr>`;
                    return;
                }

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition";
                    tr.innerHTML = `
                        <td class="py-3 px-3 font-medium text-slate-700">${user.name}</td>
                        <td class="py-3 px-3 text-slate-600">${user.email}</td>
                        <td class="py-3 px-3 text-slate-600">${user.age}</td>
                        <td class="py-3 px-3 text-right">
                            <button class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1 rounded text-xs font-medium transition" onclick="deleteUser('${user.id}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const age = parseInt(document.getElementById('age').value);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, age })
                });

                if (response.ok) {
                    document.getElementById('userForm').reset();
                    fetchUsers();
                } else {
                    alert('Failed to create user');
                }
            } catch (error) {
                console.error('Error creating user:', error);
            }
        });

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const deleteRes = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

                if (deleteRes.ok) {
                    fetchUsers();
                } else {
                    alert('Failed to delete user');
                }
            } catch (error) {
                console.error('Error deleting user:', error);
            }
        }

        fetchUsers();
    </script>
</body>
</html>
